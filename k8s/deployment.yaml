apiVersion: v1
kind: Namespace
metadata:
  name: devops-assignment

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-assignment
  labels:
    app: sample-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: zoop-app
        image: nginx:alpine 
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-assignment
spec:
#  type: NodePort
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
#      nodePort: 30080
